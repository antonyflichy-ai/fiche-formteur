name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Locate Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          test -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Compile debug APK and capture errors
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --console=plain assembleDebug 2>&1 | tee android-build-log.txt
      - name: Upload compilation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SuiviFormateur-compilation-log
          path: android-build-log.txt
          if-no-files-found: warn
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SuiviFormateur-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
